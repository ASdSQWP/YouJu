<!doctype html>
<html lang="zh-CN" data-os-theme="dark" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <style>
    html[data-theme="dark"], html[data-theme="dark"] body { background: #171717; color: #ececea; color-scheme: dark; }
    html[data-theme="light"], html[data-theme="light"] body { background: #ffffff; color: #1b1b19; color-scheme: light; }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      function apply() {
        var os = root.getAttribute("data-os-theme") === "light" ? "light" : "dark";
        var pref = root.getAttribute("data-theme-pref") || "system";
        try {
          var saved = localStorage.getItem("yj-theme");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
        } catch (e) {}
        var theme = pref === "light" || pref === "dark" ? pref : os;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-pref", pref);
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === "dark" ? "#171717" : "#ffffff";
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute("content", theme);
        try {
          document.cookie = "yj-theme=" + pref + "; Path=/; Max-Age=31536000; SameSite=Lax";
        } catch (e) {}
      }
      apply();
      window.addEventListener("pageshow", apply);
    })();
  </script>
  <title>有据 · 企业知识智能体</title>
  <meta name="description" content="每一句结论都能找到出处的企业知识智能体平台" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css?v=20261016i" />
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-spin"></div></div></div>
  <script type="module" src="/static/js/main.js?v=20261016i"></script>
</body>
</html>
