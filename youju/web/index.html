<!doctype html>
<html lang="zh-CN" data-os-theme="dark" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      var root = document.documentElement;
      var os = root.getAttribute("data-os-theme") === "light" ? "light" : "dark";
      var pref = "system";
      try {
        var saved = localStorage.getItem("yj-theme");
        if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
      } catch (e) {}
      var theme = pref === "light" || pref === "dark" ? pref : os;
      root.setAttribute("data-theme", theme);
      root.setAttribute("data-theme-pref", pref);
      root.style.colorScheme = theme;
    })();
  </script>
  <title>有据 · 企业知识智能体</title>
  <meta name="description" content="每一句结论都能找到出处的企业知识智能体平台" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-spin"></div></div></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
